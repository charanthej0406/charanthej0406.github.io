    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        
        /* Custom scrollbar for aesthetics */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b; 
        }
        ::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }

        /* Glassmorphism effects */
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Syntax highlighting simulation for code blocks */
        pre {
            background-color: #1e1e1e !important;
            border-radius: 0.5rem;
            padding: 1rem;
            overflow-x: auto;
            color: #d4d4d4;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.875rem;
        }
        .kw { color: #569cd6; } /* Keyword */
        .fn { color: #dcdcaa; } /* Function */
        .str { color: #ce9178; } /* String */
        .num { color: #b5cea8; } /* Number */
        .cmt { color: #6a9955; } /* Comment */

        /* CSS Grid Dashboard Specific Styles */
        .demo-grid-container {
            display: grid;
            grid-template-areas: 
                "header header header"
                "sidebar main main"
                "sidebar footer footer";
            grid-template-columns: 200px 1fr 1fr;
            grid-template-rows: auto 1fr auto;
            gap: 10px;
            height: 400px;
        }
        @media (max-width: 640px) {
            .demo-grid-container {
                grid-template-areas: 
                    "header"
                    "sidebar"
                    "main"
                    "footer";
                grid-template-columns: 1fr;
            }
        }
        
        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>

        // Smart Code Boilerplate Generator
        function generateSolution(title, type) {
            let titleLC = title.toLowerCase();
            
            if (type === 'html') {
                if (titleLC.includes('table')) return `<!-- Solution for: ${title} -->\n<table border="1" cellpadding="10">\n  <tr>\n    <th>Header 1</th>\n    <th>Header 2</th>\n  </tr>\n  <tr>\n    <td>Data A</td>\n    <td>Data B</td>\n  </tr>\n</table>`;
                if (titleLC.includes('list')) return `<!-- Solution for: ${title} -->\n<ul>\n  <li>Unordered Item 1</li>\n</ul>\n<ol>\n  <li>Ordered Item 1</li>\n</ol>`;
                return `<!DOCTYPE html>\n<html lang="en">\n<head>\n    <title>Document</title>\n</head>\n<body>\n    <h1>${title}</h1>\n    <p>Implementation details go here.</p>\n</body>\n</html>`;
            } 
            
            if (type === 'css') {
                if (titleLC.includes('flex')) return `/* Solution for: ${title} */\n.container {\n    display: flex;\n    justify-content: center;\n    align-items: center;\n    gap: 10px;\n}`;
                if (titleLC.includes('grid')) return `/* Solution for: ${title} */\n.grid-container {\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n    gap: 20px;\n}`;

                if (titleLC.includes('palindrome')) return `// Solution for: ${title}\nfunction isPalindrome(str) {\n    const reversed = str.split('').reverse().join('');\n    return str === reversed;\n}\nconsole.log(isPalindrome("radar")); // true`;

        // Simple syntax highlighting for code
        function highlightCode(code) {
            code = code.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            code = code.replace(/\b(function|let|const|var|if|else|for|return|try|catch|true|false|async|await)\b/g, '<span class="kw">$1</span>');
            code = code.replace(/('.*?'|".*?"|`.*?`)/g, '<span class="str">$1</span>');
            code = code.replace(/\b(\d+)\b/g, '<span class="num">$1</span>');
            code = code.replace(/(\/\/.*)/g, '<span class="cmt">$1</span>');
            code = code.replace(/(\/\*[\s\S]*?\*\/)/g, '<span class="cmt">$1</span>');
            code = code.replace(/(&lt;!--[\s\S]*?--&gt;)/g, '<span class="cmt">$1</span>');
            return code;
        }

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-y-4 gap-x-8 text-gray-300">
                            <div><span class="font-semibold text-gray-500 block text-sm uppercase tracking-wider">Student Name</span><span class="text-lg text-white font-medium">Vadithya Charan Thej</span></div>
                            <div><span class="font-semibold text-gray-500 block text-sm uppercase tracking-wider">Class / Section</span><span class="text-lg">Sai University - Cohort of 2025</span></div>
                            <div><span class="font-semibold text-gray-500 block text-sm uppercase tracking-wider">Subject</span><span class="text-lg">Web Technology & DOM</span></div>
                            <div><span class="font-semibold text-gray-500 block text-sm uppercase tracking-wider">Assignment</span><span class="text-lg">Complete Practical Programs</span></div>
                            <div class="md:col-span-2 pt-2">
                                <span class="inline-block bg-blue-900/50 text-blue-300 border border-blue-700 px-3 py-1 rounded-full text-sm font-medium shadow-sm">
                                    Total Programs: ${programsData.html.length + programsData.css.length + programsData.javascript.length}
                                </span>
                            </div>
                        </div>
                    </div>

                    <!-- Categories Grid -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 pt-6">
                        <!-- HTML Card -->
                        <div class="glass-card rounded-2xl p-6 flex flex-col items-center text-center transition-transform transform hover:-translate-y-2 hover:shadow-2xl border-t-4 border-orange-500">
                            <div class="w-16 h-16 bg-orange-500/20 text-orange-500 rounded-full flex items-center justify-center mb-4">
                                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                            </div>
                            <h3 class="text-xl font-bold mb-2">HTML Programs</h3>
                            <p class="text-gray-400 mb-2 text-sm flex-grow">Semantic structure, forms, media, tables, and HTML5 features.</p>
                            <p class="text-xs text-orange-400 font-bold mb-4">${programsData.html.length} Projects</p>
                            <button onclick="navigate('category', 'html')" class="w-full py-2 bg-orange-600 hover:bg-orange-700 text-white font-medium rounded-lg transition-colors">View Programs</button>
                        </div>
                        
                        <!-- CSS Card -->
                        <div class="glass-card rounded-2xl p-6 flex flex-col items-center text-center transition-transform transform hover:-translate-y-2 hover:shadow-2xl border-t-4 border-blue-500">
                            <div class="w-16 h-16 bg-blue-500/20 text-blue-500 rounded-full flex items-center justify-center mb-4">
                                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"></path></svg>
                            </div>
                            <h3 class="text-xl font-bold mb-2">CSS Programs</h3>
                            <p class="text-gray-400 mb-2 text-sm flex-grow">Flexbox, Grid, animations, responsive design, and styling layouts.</p>
                            <p class="text-xs text-blue-400 font-bold mb-4">${programsData.css.length} Projects</p>
                            <button onclick="navigate('category', 'css')" class="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-colors">View Programs</button>
                        </div>

                        <!-- JS Card -->
                        <div class="glass-card rounded-2xl p-6 flex flex-col items-center text-center transition-transform transform hover:-translate-y-2 hover:shadow-2xl border-t-4 border-yellow-400">
                            <div class="w-16 h-16 bg-yellow-400/20 text-yellow-400 rounded-full flex items-center justify-center mb-4">
                                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-2 1m2-1l-2-1m2 1v2.5M14 4l-2-1-2 1M4 7l2-1M4 7l2 1M4 7v2.5M12 21l-2-1m2 1l2-1m-2 1v-2.5M6 18l-2-1v-2.5M18 18l2-1v-2.5"></path></svg>
                            </div>
                            <h3 class="text-xl font-bold mb-2">JavaScript Programs</h3>
                            <p class="text-gray-400 mb-2 text-sm flex-grow">DOM manipulation, algorithms, events, and fully functional mini-projects.</p>
                            <p class="text-xs text-yellow-400 font-bold mb-4">${programsData.javascript.length} Projects</p>
                            <button onclick="navigate('category', 'javascript')" class="w-full py-2 bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold rounded-lg transition-colors">View Programs</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCategoryList(category) {
            const list = programsData[category];
            const titleMap = {
                'html': { title: 'HTML Programs', color: 'text-orange-500' },
                'css': { title: 'CSS Programs', color: 'text-blue-500' },
                'javascript': { title: 'JavaScript Programs', color: 'text-yellow-400' }
            };

            let listHTML = `
                <div class="animate-fade-in max-w-7xl mx-auto">
                    <div class="flex items-center justify-between mb-8">
                        <div class="flex items-center">
                            <button onclick="navigate('home')" class="mr-4 p-2 bg-gray-800 hover:bg-gray-700 rounded-full transition-colors text-gray-300">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                            </button>
                            <h2 class="text-3xl font-bold ${titleMap[category].color}">${titleMap[category].title}</h2>
                        </div>
                        <span class="text-sm bg-gray-800 px-4 py-2 rounded-full text-gray-300 border border-gray-700">${list.length} Programs Loaded</span>
                    </div>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            `;

            list.forEach((prog, idx) => {
                listHTML += `
                    <div onclick='openProgram("${category}", "${prog.id}")' class="glass-card p-5 rounded-xl border border-gray-700 hover:border-gray-500 cursor-pointer transition-all hover:shadow-[0_0_15px_rgba(255,255,255,0.1)] group flex flex-col h-full">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xs font-mono text-gray-500">#${idx+1}</span>
                        </div>
                        <h4 class="font-bold text-[15px] mb-2 group-hover:text-white text-gray-200 leading-tight">${prog.title}</h4>
                        <div class="mt-auto pt-4 flex justify-end">
                            <span class="text-[11px] font-semibold bg-gray-800 group-hover:bg-gray-700 text-gray-300 px-2 py-1 rounded transition-colors">View Solution &rarr;</span>
                        </div>
                    </div>
                `;
            });

            listHTML += `
                    </div>
                </div>
            `;
            
            appContainer.innerHTML = listHTML;
        }

        window.openProgram = function(cat, id) {
            const prog = programsData[cat].find(p => p.id === id);
            if(prog) navigate('program', prog);
        }

        function renderProgramViewer(program) {
            appContainer.innerHTML = `
                <div class="animate-fade-in max-w-5xl mx-auto flex flex-col h-full min-h-[75vh]">
                    <!-- Header -->
                    <div class="flex items-start sm:items-center justify-between flex-col sm:flex-row mb-6 pb-4 border-b border-gray-700 gap-4">
                        <div>
                            <div class="flex items-center text-sm text-gray-400 mb-2 space-x-2">
                                <button onclick="navigate('home')" class="hover:text-white transition-colors">Home</button>
                                <span>/</span>
                                <button onclick="navigate('category', '${getCategoryFromId(program.id)}')" class="hover:text-white transition-colors capitalize">${getCategoryFromId(program.id)}</button>
                            </div>
                            <h2 class="text-2xl sm:text-3xl font-bold text-white">${program.title}</h2>
                        </div>
                        <button onclick="navigate('category', '${getCategoryFromId(program.id)}')" class="flex-shrink-0 flex items-center px-4 py-2 bg-gray-800 hover:bg-gray-700 text-white rounded-lg transition-colors text-sm font-medium">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                            Back to List
                        </button>
                    </div>

                    <p class="text-gray-300 mb-6 text-lg">${program.description}</p>

                    <!-- Tabs -->
                    <div class="flex border-b border-gray-700 mb-6 space-x-1 overflow-x-auto">
                        <button id="tab-code" class="whitespace-nowrap px-6 py-3 bg-gray-800 text-white font-medium rounded-t-lg border-t border-l border-r border-gray-600 relative top-[1px]" onclick="switchTab('code')">
                            Source Code
                        </button>
                        <button id="tab-preview" class="whitespace-nowrap px-6 py-3 text-gray-400 hover:text-white font-medium rounded-t-lg transition-colors" onclick="switchTab('preview')">
                            Working Implementation
                        </button>
                    </div>

                    <!-- Tab Contents -->
                    <div class="flex-grow relative glass-card p-6 md:p-8 rounded-b-xl rounded-tr-xl border border-gray-700 min-h-[400px]">
                        
                        <!-- Code Panel (Set as default since most are questions) -->
                        <div id="panel-code" class="w-full h-full relative">
                            <div class="absolute top-4 right-4 z-10">
                                <button onclick="copyCode()" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1.5 rounded text-xs transition-colors flex items-center border border-gray-600 shadow">
                                    <svg class="w-3.5 h-3.5 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                                    Copy Code
                                </button>
                            </div>
                            <pre class="m-0 h-full max-h-[600px] shadow-inner text-sm md:text-base"><code id="code-content">${highlightCode(program.code)}</code></pre>
                        </div>

                        <!-- Preview Panel -->
                        <div id="panel-preview" class="hidden w-full h-full">
                            <!-- Injected dynamically -->
                        </div>

                    </div>
                </div>
            `;

            // Render the live program logic
            const previewPanel = document.getElementById('panel-preview');
            const cleanupFn = program.render(previewPanel);
            
            if(typeof cleanupFn === 'function') {
                activeCleanup = cleanupFn;
            }

            // Tab Switch Logic
            window.switchTab = function(tabId) {
                const btnPreview = document.getElementById('tab-preview');
                const btnCode = document.getElementById('tab-code');
                const panelPreview = document.getElementById('panel-preview');
                const panelCode = document.getElementById('panel-code');

                if (tabId === 'preview') {
                    btnPreview.classList.add('bg-gray-800', 'text-white', 'border-t', 'border-l', 'border-r', 'border-gray-600', 'relative', 'top-[1px]');
                    btnPreview.classList.remove('text-gray-400');
                    btnCode.classList.remove('bg-gray-800', 'text-white', 'border-t', 'border-l', 'border-r', 'border-gray-600', 'relative', 'top-[1px]');
                    btnCode.classList.add('text-gray-400');
                    
                    panelPreview.classList.remove('hidden');
                    panelCode.classList.add('hidden');
                } else {
                    btnCode.classList.add('bg-gray-800', 'text-white', 'border-t', 'border-l', 'border-r', 'border-gray-600', 'relative', 'top-[1px]');
                    btnCode.classList.remove('text-gray-400');
                    btnPreview.classList.remove('bg-gray-800', 'text-white', 'border-t', 'border-l', 'border-r', 'border-gray-600', 'relative', 'top-[1px]');
                    btnPreview.classList.add('text-gray-400');
                    
                    panelCode.classList.remove('hidden');
                    panelPreview.classList.add('hidden');
                }
            };

            // Copy to clipboard logic
            window.copyCode = function() {
                try {
                    const temp = document.createElement('div');
                    temp.innerHTML = document.getElementById('code-content').innerHTML;
                    const text = temp.textContent || temp.innerText;
                    
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    
                    const btn = document.querySelector('button[onclick="copyCode()"]');
                    const origHtml = btn.innerHTML;
                    btn.innerHTML = 'Copied!';
                    btn.classList.add('bg-green-600', 'hover:bg-green-700', 'border-green-500');
                    setTimeout(() => {
                        btn.innerHTML = origHtml;
                        btn.classList.remove('bg-green-600', 'hover:bg-green-700', 'border-green-500');
                    }, 2000);
                } catch(err) {
                    console.error('Failed to copy: ', err);
                }
            };
        }

        function getCategoryFromId(id) {
            if(id.startsWith('html')) return 'html';
            if(id.startsWith('css')) return 'css';
            if(id.startsWith('js')) return 'javascript';
            if(id.startsWith('javascript')) return 'javascript';
            return 'html';
        }

        // Initialize the App
        document.addEventListener('DOMContentLoaded', () => {
            navigate('home');
        });

    </script>
</body>
</html>
