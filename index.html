    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050b14; /* Deep, dark space background */
            color: #f8fafc;
            overflow-x: hidden;
        }
        
        /* Custom scrollbar for aesthetics */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(30, 41, 59, 0.5); 
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.4); 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.8); 
        }

        /* PREMIUM GLASSMORPHISM EFFECT */
        .glass-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.01));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        .glass-inner {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .glass-button {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.02));
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        .glass-button:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        /* Syntax highlighting simulation for code blocks */
        pre {
            background-color: rgba(15, 23, 42, 0.6) !important; /* Translucent to let background bleed through */
            border-radius: 0.5rem;
            padding: 1rem;
            overflow-x: auto;
            color: #d4d4d4;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.875rem;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
        .kw { color: #569cd6; } /* Keyword */
        .fn { color: #dcdcaa; } /* Function */
        .str { color: #ce9178; } /* String */
        .num { color: #b5cea8; } /* Number */
        .cmt { color: #6a9955; } /* Comment */

        /* Floating Blobs Animation */
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob {
            animation: blob 10s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }
        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }
        
        /* Fade In Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
    </style>
</head>

                            <h3 class="text-2xl font-bold mb-3 text-white">CSS</h3>
                            <p class="text-blue-100/60 mb-6 text-sm flex-grow leading-relaxed">Flexbox, Grid, animations, responsive design, and styling layouts.</p>
                            <button onclick="navigate('category', 'css')" class="w-full py-3 bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-400 hover:to-blue-500 text-white font-bold rounded-xl transition-all shadow-[0_4px_15px_rgba(59,130,246,0.4)]">View ${programsData.css.length} Projects</button>
                        </div>

                        <!-- JS Card -->
                        <div class="glass-card rounded-3xl p-8 flex flex-col items-center text-center transition-all duration-300 hover:-translate-y-3 hover:shadow-[0_15px_40px_rgba(250,204,21,0.2)] border-t-[3px] border-t-yellow-400 group">
                            <div class="w-20 h-20 bg-gradient-to-br from-yellow-400/20 to-yellow-600/20 border border-yellow-400/30 text-yellow-400 rounded-2xl flex items-center justify-center mb-6 shadow-[0_0_20px_rgba(250,204,21,0.15)] group-hover:scale-110 transition-transform">
                                <svg class="w-10 h-10 drop-shadow-[0_0_8px_rgba(250,204,21,0.5)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-2 1m2-1l-2-1m2 1v2.5M14 4l-2-1-2 1M4 7l2-1M4 7l2 1M4 7v2.5M12 21l-2-1m2 1l2-1m-2 1v-2.5M6 18l-2-1v-2.5M18 18l2-1v-2.5"></path></svg>
                            </div>
                            <h3 class="text-2xl font-bold mb-3 text-white">JavaScript</h3>
                            <p class="text-blue-100/60 mb-6 text-sm flex-grow leading-relaxed">DOM manipulation, algorithms, events, and fully functional projects.</p>
                            <button onclick="navigate('category', 'javascript')" class="w-full py-3 bg-gradient-to-r from-yellow-400 to-yellow-500 hover:from-yellow-300 hover:to-yellow-400 text-gray-900 font-bold rounded-xl transition-all shadow-[0_4px_15px_rgba(250,204,21,0.4)]">View ${programsData.javascript.length} Projects</button>
                        </div>

                        <!-- Node.js Card -->
                        <div class="glass-card rounded-3xl p-8 flex flex-col items-center text-center transition-all duration-300 hover:-translate-y-3 hover:shadow-[0_15px_40px_rgba(34,197,94,0.2)] border-t-[3px] border-t-green-500 group">
                            <div class="w-20 h-20 bg-gradient-to-br from-green-400/20 to-green-600/20 border border-green-500/30 text-green-400 rounded-2xl flex items-center justify-center mb-6 shadow-[0_0_20px_rgba(34,197,94,0.15)] group-hover:scale-110 transition-transform">
                                <svg class="w-10 h-10 drop-shadow-[0_0_8px_rgba(34,197,94,0.5)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"></path></svg>
                            </div>
                            <h3 class="text-2xl font-bold mb-3 text-white">Node.js</h3>
                            <p class="text-blue-100/60 mb-6 text-sm flex-grow leading-relaxed">Backend setup, Express, routing, REST APIs, and Databases.</p>
                            <button onclick="navigate('category', 'nodejs')" class="w-full py-3 bg-gradient-to-r from-green-500 to-green-600 hover:from-green-400 hover:to-green-500 text-white font-bold rounded-xl transition-all shadow-[0_4px_15px_rgba(34,197,94,0.4)]">View ${programsData.nodejs.length} Projects</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCategoryList(category) {
            const list = programsData[category];
            const titleMap = {
                'html': { title: 'HTML Programs', color: 'text-orange-400', shadow: 'drop-shadow-[0_0_8px_rgba(249,115,22,0.5)]' },
                'css': { title: 'CSS Programs', color: 'text-blue-400', shadow: 'drop-shadow-[0_0_8px_rgba(59,130,246,0.5)]' },
                'javascript': { title: 'JavaScript Programs', color: 'text-yellow-400', shadow: 'drop-shadow-[0_0_8px_rgba(250,204,21,0.5)]' },
                'nodejs': { title: 'Node.js Programs', color: 'text-green-400', shadow: 'drop-shadow-[0_0_8px_rgba(34,197,94,0.5)]' }
            };

            let listHTML = `
                <div class="animate-fade-in max-w-7xl mx-auto">
                    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-10 gap-4 glass-card p-6 rounded-2xl">
                        <div class="flex items-center">
                            <button onclick="navigate('home')" class="glass-button mr-5 p-3 rounded-xl text-white">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                            </button>
                            <h2 class="text-3xl md:text-4xl font-extrabold ${titleMap[category].color} ${titleMap[category].shadow}">${titleMap[category].title}</h2>
                        </div>
                        <span class="text-sm glass-inner px-5 py-2.5 rounded-full text-white font-semibold flex items-center shadow-[0_0_15px_rgba(0,0,0,0.3)]">
                            <div class="w-2 h-2 rounded-full bg-blue-400 mr-2"></div>
                            ${list.length} Loaded
                        </span>
                    </div>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            `;

            list.forEach((prog, idx) => {
                listHTML += `
                    <div onclick='openProgram("${category}", "${prog.id}")' class="glass-card p-6 rounded-2xl cursor-pointer transition-all duration-300 hover:-translate-y-2 hover:shadow-[0_10px_30px_rgba(255,255,255,0.1)] group flex flex-col h-full border-t border-l border-white/10 hover:border-white/30 relative overflow-hidden">
                        <div class="absolute -right-6 -top-6 w-24 h-24 bg-white/5 rounded-full blur-xl group-hover:bg-white/10 transition-all"></div>
                        <div class="flex justify-between items-start mb-4">
                            <span class="text-xs font-mono text-blue-300 bg-blue-900/40 px-2 py-1 rounded-md border border-blue-400/20 shadow-inner">Task #${idx+1}</span>
                        </div>
                        <h4 class="font-bold text-[16px] mb-4 text-gray-100 group-hover:text-white leading-snug drop-shadow-sm">${prog.title}</h4>
                        <div class="mt-auto pt-4 flex justify-end relative z-10">
                            <span class="text-xs font-bold glass-button px-4 py-2 rounded-lg text-white transition-all group-hover:bg-white/10 group-hover:shadow-[0_0_15px_rgba(255,255,255,0.2)]">Open &rarr;</span>
                        </div>
                    </div>
                `;
            });

            listHTML += `
                    </div>
                </div>
            `;
            
            appContainer.innerHTML = listHTML;
        }

        window.openProgram = function(cat, id) {
            const prog = programsData[cat].find(p => p.id === id);
            if(prog) navigate('program', prog);
        }

        function renderProgramViewer(program) {
            appContainer.innerHTML = `
                <div class="animate-fade-in max-w-6xl mx-auto flex flex-col h-full min-h-[80vh]">
                    <!-- Header -->
                    <div class="glass-card p-6 rounded-3xl mb-8 flex items-start sm:items-center justify-between flex-col sm:flex-row gap-6 relative overflow-hidden">
                        <div class="absolute -left-10 top-0 w-40 h-40 bg-white/5 rounded-full blur-3xl"></div>
                        <div class="relative z-10 w-full sm:w-auto">
                            <div class="flex items-center text-sm text-blue-200/60 mb-3 space-x-3 font-medium">
                                <button onclick="navigate('home')" class="hover:text-white transition-colors flex items-center">
                                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                                </button>
                                <span>/</span>
                                <button onclick="navigate('category', '${getCategoryFromId(program.id)}')" class="hover:text-white transition-colors capitalize px-2 py-1 bg-white/5 rounded-md border border-white/10">${getCategoryFromId(program.id)}</button>
                            </div>
                            <h2 class="text-2xl sm:text-3xl lg:text-4xl font-extrabold text-white drop-shadow-md leading-tight">${program.title}</h2>
                            <p class="text-blue-100/70 mt-3 text-md lg:text-lg max-w-3xl">${program.description}</p>
                        </div>
                        <button onclick="navigate('category', '${getCategoryFromId(program.id)}')" class="glass-button flex-shrink-0 flex items-center px-5 py-3 text-white rounded-xl text-sm font-bold w-full sm:w-auto justify-center">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                            Back
                        </button>
                    </div>

                    <!-- Tabs -->
                    <div class="flex mb-4 space-x-2 overflow-x-auto px-2">
                        <button id="tab-code" class="whitespace-nowrap px-8 py-3.5 bg-white/10 text-white font-bold rounded-2xl border border-white/20 shadow-[0_4px_15px_rgba(0,0,0,0.2)] backdrop-blur-md transition-all relative top-[2px]" onclick="switchTab('code')">
                            Source Code
                        </button>
                        <button id="tab-preview" class="whitespace-nowrap px-8 py-3.5 bg-transparent text-blue-100/60 hover:text-white hover:bg-white/5 font-bold rounded-2xl border border-transparent hover:border-white/10 transition-all" onclick="switchTab('preview')">
                            Live Preview
                        </button>
                    </div>

                    <!-- Tab Contents -->
                    <div class="flex-grow relative glass-card p-4 sm:p-8 rounded-3xl min-h-[450px]">
                        
                        <!-- Code Panel -->
                        <div id="panel-code" class="w-full h-full relative">
                            <div class="absolute top-4 right-4 z-10">
                                <button onclick="copyCode()" class="glass-button text-white px-4 py-2 rounded-lg text-xs font-bold transition-all flex items-center shadow-lg">
                                    <svg class="w-3.5 h-3.5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                                    Copy Code
                                </button>
                            </div>
                            <!-- Added max height and custom styling to integrate pre into glass look -->
                            <pre class="m-0 h-full max-h-[600px] border border-white/10 text-sm md:text-base backdrop-blur-md rounded-2xl"><code id="code-content">${highlightCode(program.code)}</code></pre>
                        </div>

                        <!-- Preview Panel -->
                        <div id="panel-preview" class="hidden w-full h-full">
                            <!-- Render callback injects here -->
                        </div>

                    </div>
                </div>
            `;

            const previewPanel = document.getElementById('panel-preview');
            const cleanupFn = program.render(previewPanel);
            
            if(typeof cleanupFn === 'function') {
                activeCleanup = cleanupFn;
            }

            window.switchTab = function(tabId) {
                const btnPreview = document.getElementById('tab-preview');
                const btnCode = document.getElementById('tab-code');
                const panelPreview = document.getElementById('panel-preview');
                const panelCode = document.getElementById('panel-code');

                if (tabId === 'preview') {
                    // Activate Preview Tab
                    btnPreview.className = "whitespace-nowrap px-8 py-3.5 bg-white/10 text-white font-bold rounded-2xl border border-white/20 shadow-[0_4px_15px_rgba(0,0,0,0.2)] backdrop-blur-md transition-all relative top-[2px]";
                    btnCode.className = "whitespace-nowrap px-8 py-3.5 bg-transparent text-blue-100/60 hover:text-white hover:bg-white/5 font-bold rounded-2xl border border-transparent hover:border-white/10 transition-all";
                    
                    panelPreview.classList.remove('hidden');
                    panelCode.classList.add('hidden');
                } else {
                    // Activate Code Tab
                    btnCode.className = "whitespace-nowrap px-8 py-3.5 bg-white/10 text-white font-bold rounded-2xl border border-white/20 shadow-[0_4px_15px_rgba(0,0,0,0.2)] backdrop-blur-md transition-all relative top-[2px]";
                    btnPreview.className = "whitespace-nowrap px-8 py-3.5 bg-transparent text-blue-100/60 hover:text-white hover:bg-white/5 font-bold rounded-2xl border border-transparent hover:border-white/10 transition-all";
                    
                    panelCode.classList.remove('hidden');
                    panelPreview.classList.add('hidden');
                }
            };

            window.copyCode = function() {
                try {
                    const temp = document.createElement('div');
                    temp.innerHTML = document.getElementById('code-content').innerHTML;
                    const text = temp.textContent || temp.innerText;
                    
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    
                    const btn = document.querySelector('button[onclick="copyCode()"]');
                    const origHtml = btn.innerHTML;
                    btn.innerHTML = '<svg class="w-3.5 h-3.5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Copied!';
                    btn.classList.add('bg-green-500/30', 'border-green-500/50', 'text-green-100');
                    setTimeout(() => {
                        btn.innerHTML = origHtml;
                        btn.classList.remove('bg-green-500/30', 'border-green-500/50', 'text-green-100');
                    }, 2000);
                } catch(err) {
                    console.error('Failed to copy: ', err);
                }
            };
        }

        function getCategoryFromId(id) {
            if(id.startsWith('html')) return 'html';
            if(id.startsWith('css')) return 'css';
            if(id.startsWith('js')) return 'javascript';
            if(id.startsWith('javascript')) return 'javascript';
            if(id.startsWith('nodejs')) return 'nodejs';
            return 'html';
        }

        // Initialize the App
        document.addEventListener('DOMContentLoaded', () => {
            navigate('home');
        });

    </script>
</body>
</html>
