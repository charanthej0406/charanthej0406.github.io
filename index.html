    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        
        /* Custom scrollbar for aesthetics */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b; 
        }
        ::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }

        /* Glassmorphism effects */
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Syntax highlighting simulation for code blocks */
        pre {
            background-color: #1e1e1e !important;
            border-radius: 0.5rem;
            padding: 1rem;
            overflow-x: auto;
            color: #d4d4d4;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.875rem;
        }
        .kw { color: #569cd6; } /* Keyword */
        .fn { color: #dcdcaa; } /* Function */
        .str { color: #ce9178; } /* String */
        .num { color: #b5cea8; } /* Number */
        .cmt { color: #6a9955; } /* Comment */

        /* CSS Grid Dashboard Specific Styles (Used in the Grid Project) */
        .demo-grid-container {
            display: grid;
            grid-template-areas: 
                "header header header"
                "sidebar main main"
                "sidebar footer footer";
            grid-template-columns: 200px 1fr 1fr;
            grid-template-rows: auto 1fr auto;
            gap: 10px;
            height: 400px;
        }
        @media (max-width: 640px) {
            .demo-grid-container {
                grid-template-areas: 
                    "header"
                    "sidebar"
                    "main"
                    "footer";
                grid-template-columns: 1fr;
            }
        }
        
        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>

let currentDisplay = '0';

function appendChar(char) {
    if (currentDisplay === '0' && char !== '.') {
        currentDisplay = char;
    } else {
        currentDisplay += char;
    }
    updateScreen();
}

function clearScreen() {
    currentDisplay = '0';
    updateScreen();
}

function calculate() {
    try {
        // Safe evaluation abstraction
        currentDisplay = String(eval(currentDisplay)); 
    } catch (e) {
        currentDisplay = 'Error';
    }
    updateScreen();
}
`,

                    code: `// Clock Logic
function updateClock() {
    const now = new Date();
    let hours = now.getHours();
    let minutes = now.getMinutes();
    let seconds = now.getSeconds();
    let ampm = hours >= 12 ? 'PM' : 'AM';
    
    hours = hours % 12;
    hours = hours ? hours : 12; // 0 should be 12
    
    minutes = minutes < 10 ? '0' + minutes : minutes;
    seconds = seconds < 10 ? '0' + seconds : seconds;
    
    document.getElementById('clockDisplay').textContent = 
        hours + ':' + minutes + ':' + seconds + ' ' + ampm;
}
setInterval(updateClock, 1000);
`,

                {

                    description: 'A precision stopwatch with start, stop, and reset functionality.',
                    code: `let startTime, updatedTime, difference, tInterval;
let running = false;

function startTimer() {
    if (!running) {
        startTime = new Date().getTime() - (difference || 0);
        tInterval = setInterval(updateDisplay, 10);
        running = true;
    }
}

function pauseTimer() {
    clearInterval(tInterval);
    running = false;
}

function resetTimer() {
    clearInterval(tInterval);
    difference = 0;
    running = false;
    display.textContent = "00:00:00.00";
}`,
                    render: (container) => {
                        container.innerHTML = `
                            <div class="max-w-md mx-auto bg-gray-800 p-8 rounded-3xl shadow-xl text-center border border-gray-700">
                                <div id="sw-display" class="text-6xl font-mono font-bold text-white mb-8 tracking-tight">00:00:00</div>
                                <div class="flex justify-center space-x-4">
                                    <button id="sw-start" class="px-6 py-2 bg-green-500 hover:bg-green-600 text-white font-bold rounded-full transition-transform transform active:scale-95">Start</button>
                                    <button id="sw-stop" class="px-6 py-2 bg-red-500 hover:bg-red-600 text-white font-bold rounded-full transition-transform transform active:scale-95">Stop</button>
                                    <button id="sw-reset" class="px-6 py-2 bg-gray-600 hover:bg-gray-500 text-white font-bold rounded-full transition-transform transform active:scale-95">Reset</button>
                                </div>
                            </div>
                        `;
                        
                        let startTime, tInterval;
                        let difference = 0;
                        let running = false;
                        const display = container.querySelector('#sw-display');
                        
                        function updateDisplay() {
                            let updatedTime = new Date().getTime();
                            difference = updatedTime - startTime;
                            
                            let hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                            let minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                            let seconds = Math.floor((difference % (1000 * 60)) / 1000);
                            let milliseconds = Math.floor((difference % 1000) / 10);
                            
                            minutes = (minutes < 10) ? "0" + minutes : minutes;
                            seconds = (seconds < 10) ? "0" + seconds : seconds;
                            milliseconds = (milliseconds < 10) ? "0" + milliseconds : milliseconds;
                            
                            display.textContent = minutes + ":" + seconds + ":" + milliseconds;
                        }
                        
                        container.querySelector('#sw-start').addEventListener('click', () => {
                            if(!running) {
                                startTime = new Date().getTime() - difference;
                                tInterval = setInterval(updateDisplay, 10);
                                running = true;
                            }
                        });
                        
                        container.querySelector('#sw-stop').addEventListener('click', () => {
                            clearInterval(tInterval);
                            running = false;
                        });
                        
                        container.querySelector('#sw-reset').addEventListener('click', () => {
                            clearInterval(tInterval);
                            running = false;
                            difference = 0;
                            display.textContent = "00:00:00";
                        });
                        
                        return () => clearInterval(tInterval);
                    }

                    title: 'Fibonacci Series Generator',
                    description: 'Generate Fibonacci sequence highlighting Iterative vs Recursive approaches.',
                    code: `/* Iterative Approach (O(n) time, O(1) space) */
function fibIterative(n) {
    let result = [];
    let a = 0, b = 1, temp;
    for(let i = 0; i < n; i++) {
        result.push(a);
        temp = a + b;
        a = b;
        b = temp;
    }
    return result;
}

/* Recursive Approach (O(2^n) time without memoization) */
function fibRecursive(n) {
    if(n <= 0) return 0;
    if(n === 1) return 1;
    return fibRecursive(n - 1) + fibRecursive(n - 2);
}

// Generate sequence using recursive approach
function generateRecursiveSequence(count) {
    let result = [];
    for(let i = 0; i < count; i++) {
        result.push(fibRecursive(i));
    }
    return result;
}`,

                            // Prevent browser crash for recursive
                            const recLimit = n > 35 ? 35 : n; 
                            
                            // Iterative
                            const t0 = performance.now();
                            let iterRes = [];
                            let a = 0, b = 1;
                            for(let i=0; i<n; i++) { iterRes.push(a); let t=a+b; a=b; b=t; }
                            const t1 = performance.now();
                            
                            container.querySelector('#fib-iter-out').textContent = iterRes.join(', ');
                            container.querySelector('#fib-iter-time').textContent = `Execution time: ${(t1-t0).toFixed(4)} ms`;
                            
                            // Recursive
